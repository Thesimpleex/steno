name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        # Depends on the Mac's language data, which the runner lacks
        run: swift test --skip testCorrectsSimilarSoundingNames
